services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vestaedu-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: vestaedu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
